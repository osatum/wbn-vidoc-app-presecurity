<section class="row">
  @if (isLoading()) {
    <div>
      <app-local-spinner
        [height]="200"
        [overlay]="false"
        [text]="'page.system.dashboard-cardinality.loading' | transloco"
      ></app-local-spinner>
    </div>
  }
  @if (hasError()) {
    <div class="card-body">
      <app-aler-data [message]="'page.system.dashboard-cardinality.load-error' | transloco"></app-aler-data>
    </div>
  }

  @if (!isLoading() && !hasError()) {
    @for (data of metrics(); track data.id) {
      <div class="col-xl-3 col-md-6">
        <div class="card card-animate">
          <div class="card-body" [ngClass]="{ 'bg-info': data.bgColor }">
            <div class="d-flex align-items-center">
              <div class="flex-grow-1">
                <p class="text-uppercase fw-medium text-{{data.labelClass}} mb-0">{{ data.labelKey | transloco }}</p>
              </div>
              <div class="flex-shrink-0">
                <h5 class="text-{{data.percentageClass}} fs-14 mb-0">
                  <i class="{{data.percentageIcon}} fs-13 align-middle"></i> {{ data.percentage }}
                </h5>
              </div>
            </div>
            <div class="d-flex align-items-end justify-content-between mt-4">
              <div>
                <h4 class="fs-22 fw-semibold ff-secondary mb-4" [ngClass]="{ 'text-white': data.counterClass }">
                  {{ data.prefix }}
                  <span
                    [countUp]="data.counter"
                    class="counter-value"
                    [countUpOptions]="option"
                  ></span>{{ data.suffix }}
                </h4>
                <div style="min-height: 35px;">
                  @if (data.captionKey) {
                    <a
                      href="javascript:void(0);"
                      routerLink="{{data.routerLink}}"
                      class="text-decoration-underline"
                      [ngClass]="{ 'text-white-50': data.captionClass }"
                    >
                      {{ data.captionKey | transloco }}
                    </a>
                  }
                </div>
              </div>
              <div class="avatar-sm flex-shrink-0">
                <span class="avatar-title {{data.iconClass}} rounded fs-3">
                  <i class="{{data.icon}} text-{{data.iconClass}}"></i>
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>
    }
  }
</section>
