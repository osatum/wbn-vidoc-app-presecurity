<!-- Vertical layout -->
@if(isVerticalLayoutRequested()){
<app-ovr-vertical></app-ovr-vertical>
}

<!-- Horizontal layout -->
@if(isHorizontalLayoutRequested()){
<app-ovr-horizontal></app-ovr-horizontal>
}
<!-- Two Columns layout -->
@if(isTwoColumnLayoutRequested()){
<app-ovr-two-column></app-ovr-two-column>
}
<!-- Semibox layout -->
@if(isSemiboxLayoutRequested()){
<app-ovr-vertical></app-ovr-vertical>}
