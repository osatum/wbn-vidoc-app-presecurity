<div
  class="safe-image"
  [class.safe-image--loaded]="state() === 'loaded'"
  [class.safe-image--error]="state() === 'error'"
  [style.aspect-ratio]="aspectRatio()"
>
  @if (state() !== 'error') {
    @if (imageSrc(); as imageSrc) {
      <img
        class="safe-image__img"
        [ngSrc]="imageSrc"
        [alt]="alt()"
        fill
        [priority]="priority()"
        [sizes]="sizes()"
        decoding="async"
        [style.object-fit]="objectFit()"
        [style.object-position]="objectPosition()"
        (load)="onImageLoad()"
        (error)="onImageError()"
      />
    }
  }

  @if (state() === 'loading') {
    <span class="safe-image__loader" aria-hidden="true"></span>
  }

  @if (state() === 'error') {
    <div
      class="safe-image__fallback"
      [attr.role]="normalizedFallbackAriaLabel() ? 'img' : null"
      [attr.aria-label]="normalizedFallbackAriaLabel()"
      [attr.aria-hidden]="normalizedFallbackAriaLabel() ? null : 'true'"
    ></div>
  }
</div>
