server:
  port: ${SERVER_PORT:8080}

app:
  security:
    jwt:
      secret: test-only-jwt-secret-with-at-least-32-characters

spring:
  h2:
    console:
      enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wbn}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:wbn-user}
    password: ${SPRING_DATASOURCE_PASSWORD:WbNuserPass24}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: false
  sql:
    init:
      mode: never
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:https://localhost:9200}
    username: ${SPRING_ELASTICSEARCH_USERNAME:elastic}
    password: ${SPRING_ELASTICSEARCH_PASSWORD:${ELASTIC_PASSWORD:change-me-local-elastic-password}}
    connection-timeout: 5s
    socket-timeout: 30s
    restclient:
      ssl:
        bundle: elasticsearch
  ssl:
    bundle:
      pem:
        elasticsearch:
          truststore:
            certificate: ${SPRING_ELASTICSEARCH_SSL_CERTIFICATE:file:/usr/share/elasticsearch/config/certs/ca/ca.crt}
